# Shared metadata mapping: Monodi / CM fields -> TEI, MEI, schema.org, Dublin Core, DataCite.
#
# ONE specification for every producer (Monodi-Zero in TypeScript, CM-hub in Python). Neither reads Excel or the
# Monodi model "by memory": both read this file and `people.csv` / `roles.csv`. Read docs/METADATA-STANDARDS.md
# first. `python -m cmhub.mapping` (and tests/test_mapping.py) check that this file is consistent.
#
# Entry shape (list `mappings`):
#   id        unique, `src.*` / `doc.*` / `x.*` (x = other formats, corpus level)
#   entity    source | document | corpus
#   from      where the value comes from. Keys (at least one):
#               monodi   field name in the Monodi-Zero model (models.<entity>.monodi)
#               cm       column(s) of Quellendaten.xlsx (source) or export_full.xlsx (document) (models.<entity>.cm)
#               config   key in `project:` or the name of a table in `people:`
#               derived  free text: computed from other data
#               proposed key of a new custom field (customSourceFields / customDocumentFields) that does not exist yet
#   to        list of {format, path[, level]}. `path` is relative to the format's root; `{name}` is an alias from
#             formats.<format>.aliases. `level` on a target overrides the entry's level for that target.
#   level     1 minimal | 2 standard | 3 extended: the lowest profile level that exports this entry
#   origin    model (Monodi field) | cm (only a CM column) | new (needs a new field or list) | auto (computed)
#   in_baseline  document entries only: true if the baseline MEI export already writes it (baseline = Monodi-Zero 0.9.1,
#             commit 1ace8b2b, state 2026-10-24; see docs/METADATA-STANDARDS.md, section "Terms")
#   verify    true if the target path has not been validated against the schema, or the modelling is an open question
#             of the project team
#   example   invented example value, only to show the shape
#   note      remark for humans, in English. `note_de` is the German original; both always come together.
#             The same pairs exist for `reason`/`reason_de` (not_exported), `question`/`question_de` (unresolved) and
#             `description`/`description_de` (dataset files).
#
# German column and field names (Quellensigle, Gattung1, ...) are data and stay as they are; everything else is English.
# "question N" in a note refers to the numbered open questions in docs/METADATA-STANDARDS.md (section "Decisions and open questions").
#
# Rule for all entries: an empty value omits the element and its empty parents. No placeholder text.

spec_version: 1

standards:
  tei:
    name: "TEI P5"
    namespace: "http://www.tei-c.org/ns/1.0"
    schema: "https://tei-c.org/release/xml/tei/custom/schema/relaxng/tei_all.rng"
  mei:
    name: "MEI 5.0"
    namespace: "http://www.music-encoding.org/ns/mei"
    schema: "monodi-light/src/app/mei/mei-all.rng (bundled with Monodi-Zero)"
    note: "The MEI emitter and the bundled schema use MEI 5.0. The template CM/MEI/header_schema.xml says 5.1. Moving to 5.1 means replacing the bundled schema; until then the Standard level writes meiversion 5.0."
    note_de: "Der MEI-Emitter und das mitgelieferte Schema nutzen MEI 5.0. Das Template CM/MEI/header_schema.xml nennt 5.1. Der Wechsel auf 5.1 bedeutet, das mitgelieferte Schema zu ersetzen; bis dahin schreibt die Standardstufe meiversion 5.0."
  jsonld:
    name: "schema.org (JSON-LD)"
  dc:
    name: "Dublin Core"
  datacite:
    name: "DataCite"

formats:
  tei:
    root: "TEI/teiHeader"
    aliases:
      msDesc: "fileDesc/sourceDesc/msDesc"
  mei:
    root: "meiHead"
    aliases:
      work: "workList/work"
      source: "fileDesc/sourceDesc/source"
      manifestation: "manifestationList/manifestation"
  mei-source:        # the description of a manuscript as a MEI file of its own (option --source-format mei); not read by Monodi-Zero
    root: "meiHead"
    aliases:
      manifestation: "manifestationList/manifestation"
  jsonld:
    root: "/"
    aliases: {}
  dc:
    root: "/"
    aliases: {}
  datacite:
    root: "/"
    aliases: {}

levels:
  1: "Minimal: equals the baseline (MEI export of Monodi-Zero 0.9.1): title, siglum, comment, genre"
  2: "Standard: schema-conformant header with publisher, licence, source, folio"
  3: "Extended: authority IDs, normalized dating, table of contents"

origins:
  model: "Field in the Monodi model"
  cm: "Only a column in the CM tables"
  new: "Does not exist in the baseline and needs a custom field or a list"
  auto: "Computed"

# Field vocabularies. A name used in `from` must be listed here; a name listed here must be used by a mapping entry
# or appear in `not_exported` / `unresolved`. So a new field cannot be forgotten silently.
models:
  source:
    monodi:   # Source in monodi-light/src/app/api.service.ts
      - quellensigle
      - herkunftsregion
      - herkunftsort
      - herkunftsinstitution
      - ordenstradition
      - quellentyp
      - bibliotheksort
      - bibliothek
      - bibliothekssignatur
      - kommentar
      - datierung
      - iiifManifestUrl
    cm:       # header row of CM/Quellendaten.xlsx (2026-10-24), spelling as in the file
      - Quellensigle
      - cantus_siglum
      - cantus_century
      - Beschreibungsformat
      - Herkunftsregion
      - Herkunftsort raw
      - Herkunftsort
      - Herkunftsinstitution
      - Ordenstradition
      - Quellentyp
      - Quellentyp 2
      - Bibliotheksort
      - Bibliothek
      - Bibliothessignatur
      - Datierung raw
      - Datierung
      - Jahrhundert
      - Precise date of host manuscript
      - Century of host manuscript
      - Kommentar
      - Kontextuelle Quelle zu
      - publish
      - Status
      - Manifest2
      - Manifest
      - Foliooffset
      - Foliooffsetold
      - Working
      - Link
      - Online catalogue
      - Print catalogue not included in previous
      - Other important literature
      - Primary information source used
      - Local images
      - beschreibung
      - notationsdokumentation
  document:
    monodi:   # Document in monodi-light/src/app/api.service.ts
      - id
      - quelle_id
      - dokumenten_id
      - gattung1
      - gattung2
      - festtag
      - feier
      - textinitium
      - bibliographischerverweis
      - druckausgabe
      - zeilenstart
      - foliostart
      - kommentar
      - editionsstatus
    cm:       # columns of export_full.xlsx (CM-hub: metadata/transform.py, snapshot.py EDITOR_TO_EXPORT / ADDITIONAL_TO_EXPORT)
      - Dokumenten_ID
      - "Doc-Id' (intern)"
      - Quellen-ID (intern)
      - Quellensigle
      - Gattung1
      - Gattung2
      - Fest
      - Feier
      - Textinitium Editionseinheit
      - Zusatz zu Textinitium
      - Nachweis_Editionseinheit
      - Druckausgabe
      - Startseite
      - Start Verso-Spalte
      - Startzeile
      - Startposition
      - Endseite
      - End Verso-Spalte
      - Endzeile
      - Kommentar
      - Editor
      - Schreibzugriff
      - Editionsstatus
      - publish
      - dontpublish
      - subcorpus
      - IIIFs
      - FestUndGattung
      - Bezugsgesang
      - Melodie Standard
      - Melodie Quelle
      - Melodiennummer_Katalog
      - Referenz auf Spiel
      - SpielName
      - Überlieferungszustand
      - Nachtragsschicht
      - Cantus_Genre
      - Cantus_Melody_ID
      - Cantus_ID
      - manuscript

# Values that belong to the project, not to a single record. They replace what is hard-coded in CM/MEI/header_schema.xml,
# so another Monodi project sets its own. In Monodi-Zero this becomes the block "Publikation" in the project settings.
project:
  project_slug: "corpus-monodicum"   # used in the dataset folder name
  publisher: "Corpus Monodicum"
  address:
    - "Domerschulstraße 13"
    - "97070 Würzburg"
  address_country: "Germany"
  address_country_authority: {auth: "TGN", uri: "http://vocab.getty.edu/page/tgn/", id: "7000084"}
  funder:
    name: "Akademie der Wissenschaften und der Literatur Mainz"
    authority: {auth: "GND", uri: "http://d-nb.info/gnd/", id: "35487-9"}
    address: ["Geschwister-Scholl-Str. 2", "55131 Mainz"]
  series_title: "Corpus Monodicum"
  document_base_uri: "https://corpus-monodicum.de/d/"   # + document UUID
  language: "en"                # language of the header text
  default_text_language: "la"   # language of the chants (TEI textLang/@mainLang)
  license_uri: "https://creativecommons.org/licenses/by-nc/4.0/"   # Question 1, decided 2026-11-02 by the project direction (docs/DECISIONS-FOR-THE-TEAM.md, D1)
  license_label: "CC BY-NC 4.0"
  # Template source: CM/MEI/header_schema.xml. The funder GND id is copied from there and not checked.

people:
  people_file: "config/people.csv"
  roles_file: "config/roles.csv"
  emails_file: "config/people-emails.csv"   # gitignored; columns person_id,email; maps the sheet column `Editor` to a person

rules:
  omit_empty: "Empty value: omit the element and its empty parents. Never write placeholder text."
  no_email: "No e-mail address in any output. Names come from people.csv."
  licence_gate: "Without project.license_uri the export runs as a draft: the file is marked 'not for publication'."
  only_published: "Only rows with publish = all are exported (see docs/PIPELINE.md)."
  xml_id: "xml:id values are slugs of the siglum: spaces become underscores, letters (umlauts included), digits, `.`, `-` and `_` stay, every other character becomes an underscore."
  profile_level: "A profile exports every entry whose level is lower than or equal to the chosen level."

mappings:

  # ------------------------------------------------------------------ source -> TEI (and its echo in the MEI header)
  - id: src.siglum
    entity: source
    from: {monodi: quellensigle, cm: Quellensigle}
    to:
      - {format: tei, path: "{msDesc}/@xml:id"}
      - {format: tei, path: "{msDesc}/msIdentifier/altIdentifier[@type='siglum']/idno"}
      - {format: mei, path: "{source}/bibl/identifier[@type='siglum']"}
      - {format: mei, path: "{manifestation}/titleStmt/title", level: 2}
      - {format: mei-source, path: "{manifestation}/@xml:id"}
      - {format: mei-source, path: "{manifestation}/identifier[@type='siglum']"}
      - {format: mei-source, path: "{manifestation}/titleStmt/title"}
      - {format: mei, path: "{manifestation}/identifier[@type='siglum']", level: 2}
    level: 1
    origin: model
    example: "Ex 1 (xml:id Ex_1)"
    note: "The siglum is not unique in the tables; the hub counts occurrences as `sigle#n` (see sources.py)."
    note_de: "Die Sigle ist in den Tabellen nicht eindeutig, der Hub zählt `sigle#n` (siehe sources.py)."

  - id: src.library_place
    entity: source
    from: {monodi: bibliotheksort, cm: Bibliotheksort}
    to:
      - {format: tei, path: "{msDesc}/msIdentifier/settlement"}
      - {format: mei-source, path: "{manifestation}/itemList/item/physLoc/repository/geogName[@role='settlement']"}
      - {format: mei, path: "{manifestation}/itemList/item/physLoc/repository/geogName[@role='settlement']", level: 2}
    level: 1
    origin: model
    example: "Exampletown"
    note: "`@ref` with an authority ID from level 3 on (authorities.places)."
    note_de: "`@ref` mit Normdaten-ID ab Stufe 3 (authorities.places)."

  - id: src.library
    entity: source
    from: {monodi: bibliothek, cm: Bibliothek}
    to:
      - {format: tei, path: "{msDesc}/msIdentifier/repository"}
      - {format: mei, path: "{manifestation}/itemList/item/physLoc/repository/corpName", level: 2}
      - {format: mei-source, path: "{manifestation}/itemList/item/physLoc/repository/corpName"}
    level: 1
    origin: model
    example: "Example Library"

  - id: src.shelfmark
    entity: source
    from: {monodi: bibliothekssignatur, cm: Bibliothessignatur}
    to:
      - {format: tei, path: "{msDesc}/msIdentifier/idno[@type='shelfmark']"}
      - {format: mei, path: "{manifestation}/itemList/item/identifier[@type='shelfmark']", level: 2}
      - {format: mei-source, path: "{manifestation}/itemList/item/identifier[@type='shelfmark']"}
    level: 1
    origin: model
    example: "Cod. 1"
    verify: true
    note: "The column is called 'Bibliothessignatur' in Quellendaten.xlsx (typo, kept as in the file). The MEI position (manifestation/itemList/item) is validated against the bundled MEI 5.0 schema (2026-10-24); the TEI path is not."
    note_de: "Die Spalte heißt in Quellendaten.xlsx 'Bibliothessignatur' (Tippfehler, so im Modell). Die MEI-Position (manifestation/itemList/item) ist gegen das mitgelieferte MEI-5.0-Schema geprüft (2026-10-24); der TEI-Pfad nicht."

  - id: src.country
    entity: source
    from: {derived: "Land der Bibliotheksort-Normdaten"}
    to:
      - {format: tei, path: "{msDesc}/msIdentifier/country"}
      - {format: mei-source, path: "{manifestation}/itemList/item/physLoc/repository/geogName[@role='country']"}
    level: 2
    origin: auto
    example: "Germany"
    note: "Derivable only if the place list carries a country."
    note_de: "Nur ableitbar, wenn die Ortsliste ein Land trägt."

  - id: src.cantus_siglum
    entity: source
    from: {cm: cantus_siglum}
    to:
      - {format: tei, path: "{msDesc}/msIdentifier/altIdentifier[@type='cantus']/idno"}
      - {format: mei-source, path: "{manifestation}/identifier[@type='cantus']"}
      - {format: mei, path: "{manifestation}/identifier[@type='cantus']", level: 2}
    level: 2
    origin: cm

  - id: src.rism_siglum
    entity: source
    from: {proposed: rism_siglum}
    to:
      - {format: tei, path: "{msDesc}/msIdentifier/altIdentifier[@type='rism']/idno"}
      - {format: mei-source, path: "{manifestation}/identifier[@type='rism']"}
    level: 3
    origin: new
    note: "Custom field or part of the library list."
    note_de: "Zusatzfeld oder Teil der Bibliotheksliste."

  - id: src.type
    entity: source
    from: {monodi: quellentyp, cm: [Quellentyp, Quellentyp 2]}
    to:
      - {format: tei, path: "{msDesc}/msContents/summary/term[@type='quellentyp']"}
      - {format: mei-source, path: "{manifestation}/classification/termList/term[@type='quellentyp']"}
      - {format: mei, path: "{manifestation}/classification/termList/term[@type='quellentyp']", level: 2}
    level: 1
    origin: model
    example: "Graduale"
    verify: true
    note: "Convention, not a TEI field. A controlled vocabulary is open (question 4)."
    note_de: "Konvention, kein TEI-Feld. Kontrolliertes Vokabular offen (question 4)."

  - id: src.order
    entity: source
    from: {monodi: ordenstradition, cm: Ordenstradition}
    to:
      - {format: tei, path: "{msDesc}/msContents/summary/term[@type='ordenstradition']"}
      - {format: mei-source, path: "{manifestation}/classification/termList/term[@type='ordenstradition']"}
      - {format: mei, path: "{manifestation}/classification/termList/term[@type='ordenstradition']", level: 2}
    level: 2
    origin: model
    verify: true
    note: "Alternative: history/origin/orgName[@type='order']. To be decided by the project team (question 4)."
    note_de: "Alternative: history/origin/orgName[@type='order']. Vom Projektteam zu entscheiden (question 4)."

  - id: src.language
    entity: source
    from: {config: default_text_language}
    to:
      - {format: tei, path: "{msDesc}/msContents/textLang/@mainLang"}
      - {format: mei-source, path: "{manifestation}/langUsage/language/@xml:lang"}
      - {format: mei, path: "{manifestation}/langUsage/language/@xml:lang", level: 2}
    level: 2
    origin: auto
    example: "la"

  - id: src.origin_place
    entity: source
    from: {monodi: herkunftsort, cm: [Herkunftsort raw, Herkunftsort]}
    to:
      - {format: tei, path: "{msDesc}/history/origin/origPlace/settlement"}
      - {format: mei-source, path: "{manifestation}/creation/geogName[@role='origin']"}
      - {format: mei, path: "{manifestation}/creation/geogName[@role='origin']", level: 2}
    level: 1
    origin: model
    example: "Exampletown"
    note: "'Herkunftsort raw' stays as element text; the normalized place becomes `@ref` (level 3)."
    note_de: "'Herkunftsort raw' bleibt Elementtext, der normalisierte Ort wird `@ref` (Stufe 3)."

  - id: src.origin_region
    entity: source
    from: {monodi: herkunftsregion, cm: Herkunftsregion}
    to:
      - {format: tei, path: "{msDesc}/history/origin/origPlace/region"}
      - {format: mei-source, path: "{manifestation}/creation/geogName[@role='origin-region']"}
      - {format: mei, path: "{manifestation}/creation/geogName[@role='origin-region']", level: 2}
    level: 2
    origin: model

  - id: src.origin_institution
    entity: source
    from: {monodi: herkunftsinstitution, cm: Herkunftsinstitution}
    to:
      - {format: tei, path: "{msDesc}/history/origin/origPlace/orgName"}
      - {format: mei-source, path: "{manifestation}/creation/corpName[@role='origin-institution']"}
      - {format: mei, path: "{manifestation}/creation/corpName[@role='origin-institution']", level: 2}
    level: 2
    origin: model

  - id: src.date_text
    entity: source
    from: {monodi: datierung, cm: Datierung raw}
    to:
      - {format: tei, path: "{msDesc}/history/origin/origDate"}
      - {format: mei, path: "{manifestation}/creation/date", level: 2}
      - {format: mei-source, path: "{manifestation}/creation/date"}
    level: 1
    origin: model
    example: "13. Jh."
    verify: true
    note: "Clarify with the sheet owners which column fills the Monodi field `datierung` ('Datierung raw' or 'Datierung')."
    note_de: "Welche Spalte das Monodi-Feld `datierung` füllt ('Datierung raw' oder 'Datierung'), mit den Sheet-Verantwortlichen klären."

  - id: src.date_normalized
    entity: source
    from: {cm: [Datierung, Jahrhundert, cantus_century]}
    to:
      - {format: tei, path: "{msDesc}/history/origin/origDate/@notBefore"}
      - {format: tei, path: "{msDesc}/history/origin/origDate/@notAfter"}
      - {format: mei, path: "{manifestation}/creation/date/@notbefore"}
      - {format: mei, path: "{manifestation}/creation/date/@notafter"}
      - {format: mei-source, path: "{manifestation}/creation/date/@notbefore"}
      - {format: mei-source, path: "{manifestation}/creation/date/@notafter"}
    level: 2
    origin: cm
    example: "1201 to 1300"
    verify: true
    note: "Needs a parser or manual curation (question 6). The roles of the three columns are not confirmed."
    note_de: "Braucht Parser oder Handpflege (question 6). Die Rollen der drei Spalten sind nicht bestätigt."

  - id: src.host_manuscript
    entity: source
    from: {cm: [Precise date of host manuscript, Century of host manuscript, Kontextuelle Quelle zu]}
    to:
      - {format: tei, path: "{msDesc}/msPart"}
      - {format: mei-source, path: "{manifestation}/componentList/manifestation"}
    level: 3
    origin: cm
    verify: true
    note: "For fragments in host volumes. Clarify the modelling (msPart or history/provenance)."
    note_de: "Für Fragmente in Hostbänden. Modellierung (msPart oder history/provenance) klären."

  - id: src.iiif
    entity: source
    from: {monodi: iiifManifestUrl, cm: [Manifest, Manifest2]}
    to:
      - {format: tei, path: "{msDesc}/additional/surrogates/bibl/ref[@type='iiif-manifest']/@target"}
      - {format: mei-source, path: "{manifestation}/relationList/relation[@rel='hasReproduction']/@target"}
      - {format: mei, path: "{manifestation}/relationList/relation[@rel='hasReproduction']/@target", level: 2}
    level: 1
    origin: model
    example: "https://example.org/manifest.json"
    note: "Two manifests give two `bibl` elements."
    note_de: "Zwei Manifeste ergeben zwei `bibl`."

  - id: src.local_images
    entity: source
    from: {cm: Local images}
    to:
      - {format: tei, path: "{msDesc}/additional/surrogates/bibl[@type='local']"}
      - {format: mei-source, path: "{manifestation}/biblList[@type='local-images']/bibl"}
      - {format: mei, path: "{manifestation}/biblList[@type='local-images']/bibl", level: 3}
    level: 3
    origin: cm

  - id: src.online_catalogue
    entity: source
    from: {cm: Online catalogue}
    to:
      - {format: tei, path: "{msDesc}/additional/listBibl[@type='catalogue-online']/bibl/ref/@target"}
      - {format: mei-source, path: "{manifestation}/biblList[@type='catalogue-online']/bibl"}
      - {format: mei, path: "{manifestation}/biblList[@type='catalogue-online']/bibl", level: 2}
    level: 2
    origin: cm

  - id: src.print_catalogue
    entity: source
    from: {cm: Print catalogue not included in previous}
    to:
      - {format: tei, path: "{msDesc}/additional/listBibl[@type='catalogue']/bibl"}
      - {format: mei-source, path: "{manifestation}/biblList[@type='catalogue']/bibl"}
      - {format: mei, path: "{manifestation}/biblList[@type='catalogue']/bibl", level: 2}
    level: 2
    origin: cm

  - id: src.literature
    entity: source
    from: {cm: Other important literature}
    to:
      - {format: tei, path: "{msDesc}/additional/listBibl[@type='literature']/bibl"}
      - {format: mei-source, path: "{manifestation}/biblList[@type='literature']/bibl"}
      - {format: mei, path: "{manifestation}/biblList[@type='literature']/bibl", level: 2}
    level: 2
    origin: cm

  - id: src.notation_doc
    entity: source
    from: {cm: notationsdokumentation}
    to:
      - {format: tei, path: "{msDesc}/physDesc/musicNotation/ref/@target"}
      - {format: mei-source, path: "{manifestation}/notesStmt/annot[@type='notation-documentation']/ref/@target"}
    level: 2
    origin: cm
    note: "The column contains Markdown. The export holds only a link to the page; the full text stays on the website."
    note_de: "Die Spalte enthält Markdown. Im Export nur ein Link auf die Seite, der Volltext bleibt auf der Webseite."

  - id: src.description
    entity: source
    from: {cm: beschreibung}
    to:
      - {format: tei, path: "{msDesc}/additional/adminInfo/note[@type='description']/ref/@target"}
      - {format: mei-source, path: "{manifestation}/notesStmt/annot[@type='description']/ref/@target"}
    level: 2
    origin: cm
    verify: true
    note: "Link to the source description. Structuring the full text belongs to implementation step 5 (docs/METADATA-STANDARDS.md)."
    note_de: "Link auf die Quellenbeschreibung. Den Volltext zu strukturieren ist Teil von Umsetzungsschritt 5 (docs/METADATA-STANDARDS.md)."

  - id: src.comment
    entity: source
    from: {monodi: kommentar, cm: Kommentar}
    to:
      - {format: tei, path: "{msDesc}/additional/adminInfo/note[@type='kommentar']"}
      - {format: mei-source, path: "{manifestation}/notesStmt/annot[@type='kommentar']"}
    level: 2
    origin: model
    verify: true
    note: "Export only if the comment is public (question 7)."
    note_de: "Nur exportieren, wenn der Kommentar öffentlich ist (question 7)."

  - id: src.physical
    entity: source
    from: {proposed: physical_description}
    to:
      - {format: tei, path: "{msDesc}/physDesc/objectDesc/supportDesc/support/material"}
      - {format: tei, path: "{msDesc}/physDesc/objectDesc/supportDesc/extent/measure[@unit='leaf']"}
      - {format: tei, path: "{msDesc}/physDesc/objectDesc/supportDesc/support/dimensions"}
      - {format: mei-source, path: "{manifestation}/physDesc/physMedium"}
      - {format: mei-source, path: "{manifestation}/physDesc/extent"}
      - {format: mei-source, path: "{manifestation}/physDesc/dimensions"}
    level: 3
    origin: new
    example: "parchment, 120 leaves"
    note: "Material, number of leaves and dimensions as custom fields (customSourceFields) with a target path."
    note_de: "Material, Blattzahl, Maße als Zusatzfelder (customSourceFields) mit Zielpfad."

  - id: src.hands_foliation
    entity: source
    from: {proposed: hands_foliation}
    to:
      - {format: tei, path: "{msDesc}/physDesc/handDesc/handNote"}
      - {format: tei, path: "{msDesc}/physDesc/objectDesc/supportDesc/foliation"}
      - {format: mei-source, path: "{manifestation}/physDesc/handList/hand"}
      - {format: mei-source, path: "{manifestation}/physDesc/foliaDesc"}
    level: 3
    origin: new

  - id: src.contents
    entity: source
    from: {derived: "alle Dokumente der Quelle: Folio, Initium, Verweis auf die MEI-Datei"}
    to:
      - {format: tei, path: "{msDesc}/msContents/msItem[@n]/locus"}
      - {format: tei, path: "{msDesc}/msContents/msItem[@n]/title[@type='incipit']"}
      - {format: mei-source, path: "{manifestation}/contents/contentItem[@n]/locus"}
      - {format: mei-source, path: "{manifestation}/contents/contentItem[@n]/title[@type='incipit']"}
    level: 3
    origin: auto
    example: "f. 1v-2r, Hodie"

  - id: src.describer
    entity: source
    from: {config: people}
    to:
      - {format: tei, path: "fileDesc/titleStmt/respStmt"}
      - {format: mei-source, path: "fileDesc/titleStmt/respStmt"}
    level: 2
    origin: new
    verify: true
    note: "Role manuscript-descriptions from roles.csv. The assignment source -> describing person is missing (question 10)."
    note_de: "Rolle manuscript-descriptions aus roles.csv. Die Zuordnung Quelle -> beschreibende Person fehlt noch."

  - id: src.publication
    entity: source
    from: {config: publisher}
    to:
      - {format: tei, path: "fileDesc/publicationStmt/publisher"}
      - {format: tei, path: "fileDesc/publicationStmt/availability/licence/@target"}
      - {format: tei, path: "fileDesc/publicationStmt/idno[@type='URI']"}
      - {format: mei-source, path: "fileDesc/pubStmt/respStmt/corpName[@role='publisher']"}
      - {format: mei-source, path: "fileDesc/pubStmt/availability/useRestrict/@auth.uri"}
      - {format: mei-source, path: "fileDesc/pubStmt/identifier"}
    level: 1
    origin: auto
    note: "Taken from `project`. For the licence see rules.licence_gate."
    note_de: "Aus project. Lizenz siehe rules.licence_gate."

  - id: src.export_info
    entity: source
    from: {derived: "Exportdatum, Werkzeug, Version"}
    to:
      - {format: tei, path: "revisionDesc/change/@when"}
      - {format: tei, path: "encodingDesc/appInfo/application"}
      - {format: mei-source, path: "revisionDesc/change/@isodate"}
      - {format: mei-source, path: "encodingDesc/appInfo/application"}
    level: 1
    origin: auto

  # ------------------------------------------------------------------ document -> MEI header
  - id: doc.id
    entity: document
    from: {monodi: dokumenten_id, cm: Dokumenten_ID}
    to:
      - {format: mei, path: "fileDesc/titleStmt/title"}
      - {format: mei, path: "{work}/identifier"}
      - {format: jsonld, path: "identifier"}
      - {format: dc, path: "dc:identifier"}
    level: 1
    origin: model
    in_baseline: true
    example: "Ex_1-1v-12"
    note: "The baseline writes only the ID as title. The template CM/MEI/header_schema.xml uses '{dokumenten_id} | {textinitium}'."
    note_de: "Im Ausgangsstand steht nur die ID im Titel. Das Template CM/MEI/header_schema.xml verwendet '{dokumenten_id} | {textinitium}'."

  - id: doc.uuid
    entity: document
    from: {monodi: id, cm: "Doc-Id' (intern)"}
    to:
      - {format: mei, path: "fileDesc/pubStmt/identifier"}
      - {format: jsonld, path: "url"}
    level: 2
    origin: model
    verify: true
    note: "URL = project.document_base_uri + UUID. The template puts it in seriesStmt/identifier; the position is to be clarified."
    note_de: "URL = project.document_base_uri + UUID. Das Template legt sie in seriesStmt/identifier; Ort klären."

  - id: doc.incipit
    entity: document
    from: {monodi: textinitium, cm: Textinitium Editionseinheit}
    to:
      - {format: mei, path: "{work}/title"}
      - {format: mei, path: "{work}/incip/incipText/p", level: 2}
      - {format: jsonld, path: "name"}
      - {format: dc, path: "dc:title"}
    level: 1
    origin: model
    in_baseline: true
    example: "Hodie"

  - id: doc.incipit_addition
    entity: document
    from: {cm: Zusatz zu Textinitium}
    to:
      - {format: mei, path: "{work}/title[@type='alternative']"}
    level: 2
    origin: cm
    example: "Incipit"

  - id: doc.genre
    entity: document
    from: {monodi: [gattung1, gattung2], cm: [Gattung1, Gattung2]}
    to:
      - {format: mei, path: "{work}/classification/termList/term[@type='genre']"}
      - {format: jsonld, path: "musicCompositionForm"}
      - {format: dc, path: "dc:subject"}
    level: 1
    origin: model
    in_baseline: true
    example: "Tropus"
    note: "The baseline writes `@type='gattung1'` and `'gattung2'`. Change to `genre` with a vocabulary (level 3: @auth and @codedval = Cantus Index code)."
    note_de: "Der Ausgangsstand schreibt `@type='gattung1'` und `'gattung2'`. Umstellen auf `genre` mit Vokabular (Stufe 3: @auth und @codedval = Cantus-Index-Code)."

  - id: doc.feast
    entity: document
    from: {monodi: [festtag, feier], cm: [Fest, Feier]}
    to:
      - {format: mei, path: "{work}/classification/termList/term[@type='feast']"}
      - {format: dc, path: "dc:subject"}
    level: 1
    origin: model
    in_baseline: true
    example: "Nativitas"

  - id: doc.vocabularies
    entity: document
    from: {config: vocabularies}
    to:
      - {format: mei, path: "encodingDesc/classDecls/taxonomy/category"}
    level: 2
    origin: new
    note: "Declares where genre and feast terms come from."
    note_de: "Erklärt, woher Gattungs- und Festbegriffe stammen."

  - id: doc.folio
    entity: document
    from:
      monodi: [foliostart, zeilenstart]
      cm: [Startseite, Start Verso-Spalte, Startzeile, Startposition, Endseite, End Verso-Spalte, Endzeile]
    to:
      - {format: mei, path: "{work}/contents/contentItem/locus"}
      - {format: mei, path: "{work}/contents/contentItem/locus/@from"}
    level: 2
    origin: model
    example: "f. 1v-2r"
    note: "The hub delivers page, verso column, line and position separately; Monodi has only foliostart and zeilenstart. Verso column and position go into the text of the locus."
    note_de: "Der Hub liefert Seite, Verso-Spalte, Zeile und Position getrennt; Monodi kennt nur foliostart und zeilenstart. Verso-Spalte und Position stehen im Text des locus."

  - id: doc.bibl_ref
    entity: document
    from: {monodi: bibliographischerverweis}
    to:
