    origin: model
    note: "Validated against the bundled MEI 5.0 schema (2026-10-24). Alternative: revisionDesc."
    note_de: "Gegen das mitgelieferte MEI-5.0-Schema geprüft (2026-10-24). Alternative: revisionDesc."

  - id: doc.source_ref
    entity: document
    from: {monodi: quelle_id, cm: [Quellen-ID (intern), Quellensigle]}
    to:
      - {format: mei, path: "{source}/@xml:id"}
      - {format: dc, path: "dc:source"}
    level: 1
    origin: model
    in_baseline: true
    note: "The fields of the source (library, shelfmark, date) arrive through the src.* entries that have a mei target."
    note_de: "Die Felder der Quelle (Bibliothek, Signatur, Datierung) kommen über die src.*-Einträge mit Ziel format mei."

  - id: doc.source_link
    entity: document
