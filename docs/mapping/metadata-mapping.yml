    to:
      - {format: mei, path: "fileDesc/notesStmt/annot[@type='document']"}
    level: 1
    origin: model
    in_baseline: true
    note: "Public comments only (question 7)."
    note_de: "Nur öffentliche Kommentare (question 7)."

  - id: doc.critical_comments
    entity: document
