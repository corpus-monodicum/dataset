    note_de: "Nur für Releases und cm-datasets, nicht pro Gesang."

# Authority files per field group (Level 3). Question numbers refer to the open questions in docs/METADATA-STANDARDS.md.
authorities:
  - {id: places, applies_to: [src.library_place, src.origin_place], services: [GND, GeoNames, TGN], question: 3}
  - {id: institutions, applies_to: [src.library, src.origin_institution], services: [GND, ISIL, RISM], question: 3}
  - {id: orders, applies_to: [src.order], services: [GND, own vocabulary], question: 4}
  - {id: genre_feast, applies_to: [doc.genre, doc.feast, doc.cantus], services: [Cantus Index], question: 5}
  - {id: persons, applies_to: [doc.editor, doc.project_credits, src.describer], services: [ORCID, GND], question: 2}
  - {id: licence, applies_to: [src.publication, doc.publication], services: [SPDX, creativecommons.org], question: 1}
  - {id: images, applies_to: [src.iiif], services: [IIIF], question: null}

# Columns that are never exported. `reason` is mandatory.
not_exported:
  - {entity: source, cm: Beschreibungsformat, reason: "internal; the project team must confirm what the values mean", reason_de: "intern, Bedeutung der Werte vom Projektteam bestätigen"}
  - {entity: source, cm: publish, reason: "only controls which rows are exported", reason_de: "steuert nur, welche Zeilen exportiert werden"}
  - {entity: source, cm: Status, reason: "internal working state", reason_de: "interner Arbeitsstand"}
  - {entity: source, cm: Foliooffset, reason: "internal; only used to match folio to image", reason_de: "intern, nur für die Zuordnung Folio zu Bild"}
  - {entity: source, cm: Foliooffsetold, reason: "internal; only used to match folio to image", reason_de: "intern, nur für die Zuordnung Folio zu Bild"}
  - {entity: source, cm: Working, reason: "internal working state", reason_de: "interner Arbeitsstand"}
  - {entity: document, cm: Schreibzugriff, reason: "e-mail addresses (rules.no_email)", reason_de: "E-Mail-Adressen (rules.no_email)"}
  - {entity: document, cm: publish, reason: "only controls which rows are exported (rules.only_published)", reason_de: "steuert nur, welche Zeilen exportiert werden (rules.only_published)"}
  - {entity: document, cm: dontpublish, reason: "only controls which rows are exported", reason_de: "steuert nur, welche Zeilen exportiert werden"}
  - {entity: document, cm: FestUndGattung, reason: "helper column derived from Nachweis_Editionseinheit (tropes only)", reason_de: "Hilfsspalte, abgeleitet aus Nachweis_Editionseinheit (nur Tropen)"}

# Columns whose meaning is not confirmed. Do not map them before the question is answered.
unresolved:
  - {entity: source, cm: Link, question: "What does the column contain? A link to what?", question_de: "Was enthält die Spalte? Ein Link worauf?"}
  - {entity: source, cm: Primary information source used, question: "Internal or bibliographic? Confirm what the values mean", question_de: "Intern oder bibliographisch? Bedeutung der Werte bestätigen"}
  - {entity: document, cm: manuscript, question: "Key from the editor's additionalData; clarify its meaning and its relation to quelle_id", question_de: "Schlüssel aus additionalData des Editors; Bedeutung und Verhältnis zu quelle_id klären"}

# Credits: who is named in the metadata of which source and chant. The sheet config/credits.csv is edited by hand
# (docs/METADATA-STANDARDS.md, section 17). Category names and genre names are data and stay German.
credits:
  file: "config/credits.csv"
  # Category on the team page of the project -> genres (`gattung1`) of the documents
  categories:
    Ordinariumsgesänge: [Agnus, Benedicamus, Credo, Gloria, Ite missa est, Kyrie, Requiescant, Sanctus, Humiliate vos]
    Tropen: [Tropus]
    Sequenzen: [Sequenz]
    Lieder: [Lied, Benedicamus Domino]
    Spiele: [Spiele-Passus, Spiel]
  # Roles named in the MEI header of a chant (for its source and category) and in the TEI file of a source
  document_roles: [edition, text-edition, text-revision]
  source_roles: [edition, text-edition, text-revision, manuscript-descriptions]
  # Roles of the whole project: named in the TEI file of every source as `principal` (project direction) and in docs/CONTRIBUTORS.md
  project_roles: [project-direction]

# Target picture: ONE folder (the dataset) that holds everything created in Monodi in a standardized, documented layout.
# This block is the layout specification. `python -m cmhub.dataset` / `cm dataset package` creates exactly these paths.
# Documentation: docs/METADATA-STANDARDS.md, sections 14 and 16.
#
#   placeholders  names allowed inside `path`; {source_id} is the siglum slug (rules.xml_id), {document_id} the Dokumenten_ID,
#                 {asset} a file path below the notation folder of a source (for example patterns/p01.svg)
#   files         one entry per file or file pattern:
#     id            unique, `ds.*`
#     path          relative to the dataset root; ends with `/` for a directory. File names repeat the id of their source or
#                   document, so a file is still identifiable when it is copied out of its folder.
#     entity        corpus | source | document
#     format        what the file is: md, html, json, csv, txt, tei, mei, ro-crate, cff, yaml, image, dir
#     level         lowest profile level (1-3) that writes the file
#     required      true if a dataset is invalid without it
#     lossless      true if the file keeps the Monodi data completely. The text fields `beschreibung` and
#                   `notationsdokumentation` of a source are moved to their own files when those files are written; the
#                   metadata file then names the files in `dataset_external_files`.
#     generated_from where the content comes from (mapping ids, tables, Monodi data)
#     description   what the file contains, for readers who open the folder
dataset:
  layout_version: 1
  root_name: "{project_slug}-{version}"
  placeholders: [source_id, document_id, asset]
  files:
    - {id: ds.readme, path: "README.md", entity: corpus, format: md, level: 1, required: true, lossless: false,
       generated_from: "project, counts, this layout", description: "Entry point: content, structure, how to cite, licence, version", description_de: "Einstieg: Inhalt, Aufbau, Zitierweise, Lizenz, Version"}
    - {id: ds.structure, path: "docs/STRUCTURE.md", entity: corpus, format: md, level: 1, required: true, lossless: false,
       generated_from: "dataset.files", description: "Explanation of every file and folder of this structure", description_de: "Erklärung jeder Datei und jedes Ordners dieser Struktur"}
    - {id: ds.contributors, path: "docs/CONTRIBUTORS.md", entity: corpus, format: md, level: 1, required: true, lossless: false,
       generated_from: "people, roles, credits", description: "Everybody who contributed, with roles, periods and the sources they are credited for", description_de: "Alle Beteiligten mit Rollen, Zeiträumen und den Quellen, für die sie genannt werden"}
    - {id: ds.license, path: "LICENSE.txt", entity: corpus, format: txt, level: 1, required: true, lossless: false,
