    level: 1
    origin: auto
    note: "Hard-coded in the template CM/MEI/header_schema.xml, with the date 2020-10-10 and the placeholder 'LICENCE STATEMENT'. Taken from `project` here instead."
    note_de: "Im Template CM/MEI/header_schema.xml fest eingetragen, mit Datum 2020-10-10 und dem Platzhalter 'LICENCE STATEMENT'. Hier stattdessen aus `project`."

