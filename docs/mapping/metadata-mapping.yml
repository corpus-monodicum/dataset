    verify: true

  - id: doc.hub_extra
    entity: document
    from: {cm: [Melodie Standard, Melodie Quelle, Melodiennummer_Katalog, Referenz auf Spiel, SpielName, Überlieferungszustand, Nachtragsschicht]}
    to:
      - {format: mei, path: "{work}/classification/termList/term[@type]"}
    level: 3
    origin: cm
    verify: true
    note: "Further hub fields. Clarify with the editors whether they are public and how they should be named."
    note_de: "Weitere Hub-Felder. Ob sie öffentlich sind und wie sie heißen sollen, mit den Bearbeitenden klären."

  - id: doc.iiif
    entity: document
    from: {cm: IIIFs}
    to:
      - {format: mei, path: "{manifestation}/itemList/item/ptr[@type='iiif']"}
