    to:
      - {format: mei, path: "fileDesc/notesStmt/annot[@startid][@endid]"}
    level: 1
    origin: auto
    in_baseline: true
    note: "Unchanged from the baseline."
    note_de: "Unverändert gegenüber dem Ausgangsstand."

  - id: doc.edition_status
